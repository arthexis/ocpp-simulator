[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocpp-simulator"
version = "0.1.0"
description = "Minimal OCPP 1.6J charge-point simulator"
requires-python = ">=3.11"
dependencies = ["ocpp>=0.26,<1", "websockets>=12,<14"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<2"]

[project.scripts]
ocpp-simulator = "ocpp_simulator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
