name: Install OCPP simulator on gway-001

# Never runs for Draft PR checks. Merge to the protected main branch is the trigger.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ocpp-simulator-main-gway-001
  cancel-in-progress: false

jobs:
  install:
    if: github.repository == 'arthexis/ocpp-simulator' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64, gway-001]
    timeout-minutes: 45
    steps:
      - name: Reject superseded main before checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current="$(gh api repos/arthexis/ocpp-simulator/branches/main --jq '.commit.sha')"
          if [[ "$current" != "$TARGET_SHA" ]]; then
            echo "::notice::Skipping superseded SHA $TARGET_SHA; main is $current"
            echo "DEPLOY_SKIPPED=true" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: env.DEPLOY_SKIPPED != 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify reviewed source, identity and prior release pointers
        if: env.DEPLOY_SKIPPED != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(id -un)" = arthe
          test "$(uname -m)" = aarch64
          command -v ansible-playbook
          command -v go
          command -v flock
          command -v python3
          test "$(git rev-parse --verify HEAD)" = "$TARGET_SHA"
          test "$(gh api repos/arthexis/ocpp-simulator/branches/main --jq '.commit.sha')" = "$TARGET_SHA"
          root="$HOME/.local/share/ocpp-simulator"
          for name in current previous; do
            path="$root/$name"
            if [[ -L "$path" ]]; then
              printf 'BEFORE_%s=%s\n' "${name^^}" "$(readlink "$path")" >> "$GITHUB_ENV"
            elif [[ -e "$path" ]]; then
              echo "::error::Unmanaged $path"
              exit 1
            else
              printf 'BEFORE_%s=\n' "${name^^}" >> "$GITHUB_ENV"
            fi
          done

      - name: Build and activate versioned release using existing Ansible
        if: env.DEPLOY_SKIPPED != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(gh api repos/arthexis/ocpp-simulator/branches/main --jq '.commit.sha')" = "$TARGET_SHA"
          # deploy.sh holds the existing owner-scoped flock and runs local Ansible.
          # The role installs binaries and symlinks; it does not start the simulator.
          sh ./deploy.sh

      - name: Verify release, both backends and isolated client (no start)
        if: env.DEPLOY_SKIPPED != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/verify_main_install.py \
            --root "$HOME/.local/share/ocpp-simulator" \
            --bin-dir "$HOME/.local/bin" \
            --expected-sha "$TARGET_SHA" \
            --before-current "$BEFORE_CURRENT" \
            --before-previous "$BEFORE_PREVIOUS"
          "$HOME/.local/bin/ocpp-simulator" --help
          "$HOME/.local/bin/ocpp-simulator-py" --help
          "$HOME/.local/bin/ocpp-simulator-go" --help
          go version -m "$HOME/.local/share/ocpp-simulator/current/bin/r6c3b2-uidlab" \
            | grep -F 'github.com/lorenzodonini/ocpp-go' | grep -F 'v0.19.0'
          test "$(gh api repos/arthexis/ocpp-simulator/branches/main --jq '.commit.sha')" = "$TARGET_SHA"
          echo "Installed simulator release $TARGET_SHA without starting any simulator session" >> "$GITHUB_STEP_SUMMARY"
