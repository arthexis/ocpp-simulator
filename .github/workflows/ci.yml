name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  changes:
    name: Validate change scope
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify documentation-only changes
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          docs_only=true
          if (( ${#changed[@]} == 0 )); then docs_only=false; fi
          for path in "${changed[@]}"; do
            case "$path" in
              README.md|docs/*|*.md) ;;
              *) docs_only=false; break ;;
            esac
          done
          printf 'Changed files:\n'; printf '  %s\n' "${changed[@]}"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  docs:
    name: Documentation only
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    steps:
      - run: echo "Documentation-only change validated"

  test:
    name: ${{ matrix.platform }}
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Debian 12 / Python 3.11
            image: python:3.11-bookworm
          - platform: Debian 13 / Python 3.13
            image: python:3.13-trixie
    timeout-minutes: 8
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Installed CLI
        run: ocpp-simulator --help
      - name: Tests
        run: timeout 180s python -m pytest -vv -s

  ansible:
    name: Ansible installer
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: sh -n deploy.sh
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: go/go.mod
      - name: Install Ansible
        run: python -m pip install ansible-core ansible-lint
      - name: Playbook syntax
        run: ANSIBLE_ROLES_PATH=ansible/roles ansible-playbook ansible/playbooks/install.yml -i localhost, --syntax-check
      - name: Ansible lint
        run: ANSIBLE_ROLES_PATH=ansible/roles ansible-lint --profile basic ansible/
      - name: Deploy both backends with Ansible
        run: ./deploy.sh
      - name: Smoke installed CLI and verify immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git rev-parse --verify HEAD)
          root="$HOME/.local/share/ocpp-simulator"
          test "$(readlink "$root/current")" = "$root/releases/$sha"
          test "$(cat "$root/current/.revision")" = "$sha"
          test "$(readlink "$HOME/.local/bin/ocpp-simulator")" = "$root/current/bin/ocpp-simulator"
          "$HOME/.local/bin/ocpp-simulator" --help
          "$HOME/.local/bin/ocpp-simulator-py" --help
          "$HOME/.local/bin/ocpp-simulator-go" --help
          "$HOME/.local/bin/ocpp-simulator" --backend go run --help
          "$HOME/.local/bin/ocpp-simulator" --backend python run --help
          # Same-SHA deploy must leave the current pointer unchanged.
          ./deploy.sh
          test "$(readlink "$root/current")" = "$root/releases/$sha"
          test ! -e "$root/previous"


  go-spike:
    name: Go OCPP spike
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: go/go.mod
      - name: Resolve pinned dependencies
        run: go mod tidy
      - name: Format Go spike
        run: gofmt -w cmd internal
      - name: Vet
        run: go vet ./...
      - name: Test loopback CSMS integration
        run: go test -race -count=1 ./...
      - name: Build Linux arm64
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /tmp/ocpp-simulator-go ./cmd/ocpp-simulator-go
      - name: Verify pinned ocpp-go v0.19.0 and sumdb (LAB-5)
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOSUMDB)" != off
          go mod download -json github.com/lorenzodonini/ocpp-go@v0.19.0 | jq -e \
            '.Path == "github.com/lorenzodonini/ocpp-go" and .Version == "v0.19.0" and .Sum == "h1:THNriVV3bUWkGzaIkDeytcgoeBRjoN9ezPHsddIDfgc=" and (.Error == null)'
          go mod verify
      - name: R6C-3B2 offline UID negative tests (LAB-5)
        run: go test -race -count=3 ./internal/spike -run '^TestR6C3B2LAB5'
      - name: Cross-compile offline ARM64 UID test executable (LAB-5)
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r6c3b2-lab5
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go test -c -trimpath -o /tmp/r6c3b2-lab5/uidlab-linux-arm64.test ./internal/spike
          file /tmp/r6c3b2-lab5/uidlab-linux-arm64.test | grep -F 'ELF 64-bit'
          readelf -h /tmp/r6c3b2-lab5/uidlab-linux-arm64.test | grep -F 'AArch64'
          go version -m /tmp/r6c3b2-lab5/uidlab-linux-arm64.test | tee /tmp/r6c3b2-lab5/provenance.txt
          # Go test executables may not embed dependency lines in go version -m.
          # Verify the exact pinned dependency independently in the module graph.
          go list -m -json github.com/lorenzodonini/ocpp-go > /tmp/r6c3b2-lab5/ocpp-go-module.json
          jq -e '.Path == "github.com/lorenzodonini/ocpp-go" and .Version == "v0.19.0" and .Sum == "h1:THNriVV3bUWkGzaIkDeytcgoeBRjoN9ezPHsddIDfgc="' /tmp/r6c3b2-lab5/ocpp-go-module.json
          ( cd /tmp/r6c3b2-lab5 && sha256sum uidlab-linux-arm64.test > SHA256SUMS && sha256sum -c SHA256SUMS )
          printf 'checkout=%s\n' "$(git rev-parse HEAD)" > /tmp/r6c3b2-lab5/source-identity.txt
          printf 'event=%s\n' "$GITHUB_EVENT_NAME" >> /tmp/r6c3b2-lab5/source-identity.txt
          printf 'pr_head=%s\n' "$PR_HEAD_SHA" >> /tmp/r6c3b2-lab5/source-identity.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r6c3b2-lab5-arm64-offline-test-elf
          path: /tmp/r6c3b2-lab5/
          if-no-files-found: error
          retention-days: 7

  ci:
    name: CI
    needs: [changes, docs, test, ansible, go-spike]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce results
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          DOCS: ${{ needs.docs.result }}
          TEST: ${{ needs.test.result }}
          ANSIBLE: ${{ needs.ansible.result }}
          GO_SPIKE: ${{ needs.go-spike.result }}
        run: |
          set -euo pipefail
          [[ "$CHANGES" == "success" ]] || exit 1
          if [[ "$DOCS_ONLY" == "true" ]]; then
            [[ "$DOCS" == "success" ]] || exit 1
          else
            [[ "$TEST" == "success" ]] || exit 1
            [[ "$ANSIBLE" == "success" ]] || exit 1
            [[ "$GO_SPIKE" == "success" ]] || exit 1
          fi
