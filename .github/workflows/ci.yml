name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  changes:
    name: Validate change scope
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify documentation-only changes
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          docs_only=true
          if (( ${#changed[@]} == 0 )); then docs_only=false; fi
          for path in "${changed[@]}"; do
            case "$path" in
              README.md|docs/*|*.md) ;;
              *) docs_only=false; break ;;
            esac
          done
          printf 'Changed files:\n'; printf '  %s\n' "${changed[@]}"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  docs:
    name: Documentation only
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    steps:
      - run: echo "Documentation-only change validated"

  test:
    name: ${{ matrix.platform }}
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Debian 12 / Python 3.11
            image: python:3.11-bookworm
          - platform: Debian 13 / Python 3.13
            image: python:3.13-trixie
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Installed CLI
        run: ocpp-simulator --help
      - name: Tests
        run: python -m pytest -q

  ci:
    name: CI
    needs: [changes, docs, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce results
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          DOCS: ${{ needs.docs.result }}
          TEST: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          [[ "$CHANGES" == "success" ]] || exit 1
          if [[ "$DOCS_ONLY" == "true" ]]; then
            [[ "$DOCS" == "success" ]] || exit 1
          else
            [[ "$TEST" == "success" ]] || exit 1
          fi
