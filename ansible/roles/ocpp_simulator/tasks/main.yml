---
- name: Validate deployment user and supported Python
  ansible.builtin.assert:
    that:
      - ansible_user_uid | int != 0
      - ansible_facts.python.version.major | int == 3
      - ansible_facts.python.version.minor | int >= 11
    fail_msg: OCPP simulator requires a non-root account with Python 3.11 or newer.

- name: Identify complete checkout revision
  ansible.builtin.command:
    argv: [git, -C, "{{ ocpp_simulator_source }}", rev-parse, --verify, HEAD]
  register: ocpp_simulator_revision
  changed_when: false

- name: Validate immutable revision identifier
  ansible.builtin.assert:
    that:
      - ocpp_simulator_revision.stdout is match('^[0-9a-f]{40}$')
    fail_msg: A full 40-character Git commit is required for immutable releases.

- name: Capture optional expected main SHA from automatic deployment
  ansible.builtin.set_fact:
    ocpp_simulator_expected_main_sha: "{{ lookup('ansible.builtin.env', 'OCPP_SIMULATOR_EXPECTED_MAIN_SHA') }}"

- name: Fail closed on malformed or mismatched expected main SHA
  ansible.builtin.assert:
    that:
      - >-
        ocpp_simulator_expected_main_sha == '' or
        (ocpp_simulator_expected_main_sha is match('^[0-9a-f]{40}$') and
        ocpp_simulator_expected_main_sha == ocpp_simulator_revision.stdout)
    fail_msg: Automatic deployment SHA must match this exact checkout before staging.

- name: Select immutable release paths
  ansible.builtin.set_fact:
    ocpp_simulator_release: "{{ ocpp_simulator_prefix }}/releases/{{ ocpp_simulator_revision.stdout }}"
    ocpp_simulator_current: "{{ ocpp_simulator_prefix }}/current"
    ocpp_simulator_previous: "{{ ocpp_simulator_prefix }}/previous"

- name: Create simulator installation directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ ocpp_simulator_prefix }}"
    - "{{ ocpp_simulator_prefix }}/releases"
    - "{{ ocpp_simulator_bin_dir }}"

- name: Inspect immutable release directory
  ansible.builtin.stat:
    path: "{{ ocpp_simulator_release }}"
    follow: false
  register: ocpp_simulator_existing

- name: Verify existing release provenance and installation
  ansible.builtin.command:
    argv:
      - "{{ ocpp_simulator_release }}/bin/python"
      - -c
      - >-
        from importlib.metadata import distribution;
        from pathlib import Path;
        import ocpp_simulator;
        root = Path('{{ ocpp_simulator_release }}').resolve();
        assert (root / '.revision').read_text().strip() == '{{ ocpp_simulator_revision.stdout }}';
        assert distribution('ocpp-simulator').version;
        assert Path(ocpp_simulator.__file__).resolve().is_relative_to(root);
        assert (root / 'bin/ocpp-simulator').is_file()
  register: ocpp_simulator_release_probe
  changed_when: false
  failed_when: false
  when: ocpp_simulator_existing.stat.exists | default(false)

- name: Verify existing release executable
  ansible.builtin.command:
    argv: ["{{ ocpp_simulator_release }}/bin/ocpp-simulator", --help]
  register: ocpp_simulator_command_probe
  changed_when: false
  failed_when: false
  when:
    - ocpp_simulator_existing.stat.exists | default(false)
    - ocpp_simulator_release_probe.rc | default(1) == 0

- name: Inspect Go executable in immutable release
  ansible.builtin.stat:
    path: "{{ ocpp_simulator_release }}/bin/ocpp-simulator-go"
  register: ocpp_simulator_existing_go
  when:
    - ocpp_simulator_existing.stat.exists | default(false)

- name: Reject existing release lacking Go executable
  ansible.builtin.assert:
    that:
      - ocpp_simulator_existing_go.stat.isreg | default(false)
      - ocpp_simulator_existing_go.stat.executable | default(false)
    fail_msg: >-
      Existing immutable release lacks the Go backend; refusing in-place
      modification. Use a new revision containing both backends.
  when:
    - ocpp_simulator_existing.stat.exists | default(false)

- name: Inspect isolated LAB-6 client in immutable release
  ansible.builtin.stat:
    path: "{{ ocpp_simulator_release }}/bin/r6c3b2-uidlab"
  register: ocpp_simulator_existing_lab
  when: ocpp_simulator_existing.stat.exists | default(false)

- name: Reject existing release missing isolated LAB-6 client
  ansible.builtin.assert:
    that:
      - ocpp_simulator_existing_lab.stat.isreg | default(false)
      - ocpp_simulator_existing_lab.stat.executable | default(false)
    fail_msg: Existing immutable release lacks the test-only client; refusing in-place repair.
  when: ocpp_simulator_existing.stat.exists | default(false)

- name: Reject incomplete immutable release without modifying it
  ansible.builtin.assert:
    that:
      - ocpp_simulator_existing.stat.isdir | default(false)
      - ocpp_simulator_release_probe.rc | default(1) == 0
      - ocpp_simulator_command_probe.rc | default(1) == 0
    fail_msg: Existing simulator release is incomplete or has mismatched provenance; refusing in-place repair.
  when: ocpp_simulator_existing.stat.exists | default(false)

- name: Create versioned virtual environment
  ansible.builtin.command:
    argv: ["{{ ocpp_simulator_python }}", -m, venv, "{{ ocpp_simulator_release }}"]
    creates: "{{ ocpp_simulator_release }}/bin/python"
  when: not (ocpp_simulator_existing.stat.exists | default(false))

- name: Install requested checkout into versioned release
  ansible.builtin.command:
    argv:
      - "{{ ocpp_simulator_release }}/bin/python"
      - -m
      - pip
      - install
      - --disable-pip-version-check
      - "{{ ocpp_simulator_source }}"
  when: not (ocpp_simulator_existing.stat.exists | default(false))

- name: Stage Go sources without modifying the Git checkout
  ansible.builtin.copy:
    src: "{{ ocpp_simulator_source }}/go/"
    dest: "{{ ocpp_simulator_release }}/go-source/"
    remote_src: true
    mode: preserve
  when:
    - not (ocpp_simulator_existing.stat.exists | default(false))

- name: Resolve Go module checksums in staged source
  ansible.builtin.command:
    argv: [go, mod, tidy]
    chdir: "{{ ocpp_simulator_release }}/go-source"
  environment:
    GOTOOLCHAIN: local
  when:
    - not (ocpp_simulator_existing.stat.exists | default(false))

- name: Inspect pinned ocpp-go module in staged source
  ansible.builtin.command:
    argv: [go, list, -m, -json, github.com/lorenzodonini/ocpp-go]
    chdir: "{{ ocpp_simulator_release }}/go-source"
  environment:
    GOTOOLCHAIN: local
  register: ocpp_simulator_ocpp_go_module
  changed_when: false
  when: not (ocpp_simulator_existing.stat.exists | default(false))

- name: Reject unpinned ocpp-go module
  ansible.builtin.assert:
    that:
      - (ocpp_simulator_ocpp_go_module.stdout | from_json).Path == 'github.com/lorenzodonini/ocpp-go'
      - (ocpp_simulator_ocpp_go_module.stdout | from_json).Version == 'v0.19.0'
      - (ocpp_simulator_ocpp_go_module.stdout | from_json).Sum == 'h1:THNriVV3bUWkGzaIkDeytcgoeBRjoN9ezPHsddIDfgc='
    fail_msg: Staged source does not resolve the pinned ocpp-go v0.19.0 module.
  when: not (ocpp_simulator_existing.stat.exists | default(false))

- name: Verify staged Go module integrity
  ansible.builtin.command:
    argv: [go, mod, verify]
    chdir: "{{ ocpp_simulator_release }}/go-source"
  environment:
    GOTOOLCHAIN: local
  changed_when: false
  when: not (ocpp_simulator_existing.stat.exists | default(false))

- name: Build pinned Go backend into candidate release
  ansible.builtin.command:
    argv:
      - go
      - build
      - -o
      - "{{ ocpp_simulator_release }}/bin/ocpp-simulator-go"
      - ./cmd/ocpp-simulator-go
    chdir: "{{ ocpp_simulator_release }}/go-source"
  environment:
    GOTOOLCHAIN: local
  when:
    - not (ocpp_simulator_existing.stat.exists | default(false))

- name: Build isolated LAB-6 client into the same candidate release
  ansible.builtin.command:
    argv:
      - go
      - build
      - -trimpath
      - -o
      - "{{ ocpp_simulator_release }}/bin/r6c3b2-uidlab"
      - ./cmd/r6c3b2-uidlab
    chdir: "{{ ocpp_simulator_release }}/go-source"
  environment:
    GOTOOLCHAIN: local
    CGO_ENABLED: "0"
  when: not (ocpp_simulator_existing.stat.exists | default(false))

- name: Calculate relative checksum of isolated LAB-6 client
  ansible.builtin.command:
    argv: [sha256sum, r6c3b2-uidlab]
    chdir: "{{ ocpp_simulator_release }}/bin"
  register: ocpp_simulator_lab_sha256
  changed_when: false
  when: not (ocpp_simulator_existing.stat.exists | default(false))

- name: Store isolated LAB-6 client checksum in immutable release
  ansible.builtin.copy:
    dest: "{{ ocpp_simulator_release }}/bin/r6c3b2-uidlab.sha256"
    content: "{{ ocpp_simulator_lab_sha256.stdout }}\n"
    mode: "0644"
  when: not (ocpp_simulator_existing.stat.exists | default(false))

- name: Verify isolated LAB-6 client checksum before activation
  ansible.builtin.command:
    argv: [sha256sum, -c, r6c3b2-uidlab.sha256]
    chdir: "{{ ocpp_simulator_release }}/bin"
  changed_when: false

- name: Verify Go backend
  ansible.builtin.command:
    argv: ["{{ ocpp_simulator_release }}/bin/ocpp-simulator-go", --help]
  register: ocpp_simulator_go_probe
  changed_when: false

- name: Record release provenance
  ansible.builtin.copy:
    dest: "{{ ocpp_simulator_release }}/.revision"
    content: "{{ ocpp_simulator_revision.stdout }}\n"
    mode: "0644"
  when: not (ocpp_simulator_existing.stat.exists | default(false))

- name: Verify candidate release before activation
  ansible.builtin.command:
    argv: ["{{ ocpp_simulator_release }}/bin/ocpp-simulator", --help]
  changed_when: false

- name: Inspect existing current release link
  ansible.builtin.stat:
    path: "{{ ocpp_simulator_current }}"
    follow: false
  register: ocpp_simulator_current_stat

- name: Refuse unsafe current release path
  ansible.builtin.assert:
    that:
      - ocpp_simulator_current_stat.stat.islnk | default(false)
    fail_msg: Simulator current path exists but is not a managed symlink.
  when: ocpp_simulator_current_stat.stat.exists | default(false) or
        ocpp_simulator_current_stat.stat.islnk | default(false)

- name: Read currently active release target
  ansible.builtin.command:
    argv: [readlink, "{{ ocpp_simulator_current }}"]
  register: ocpp_simulator_old_target
  changed_when: false
  when: ocpp_simulator_current_stat.stat.islnk | default(false)

- name: Determine whether activation is necessary
  ansible.builtin.set_fact:
    ocpp_simulator_activate: >-
      {{ ocpp_simulator_old_target.stdout | default('') != ocpp_simulator_release }}

- name: Inspect existing previous release pointer
  ansible.builtin.stat:
    path: "{{ ocpp_simulator_previous }}"
    follow: false
  register: ocpp_simulator_previous_stat

- name: Refuse unmanaged previous release path
  ansible.builtin.assert:
    that:
      - ocpp_simulator_previous_stat.stat.islnk | default(false)
    fail_msg: Simulator previous path exists but is not a managed symlink.
  when: ocpp_simulator_previous_stat.stat.exists | default(false) or
        ocpp_simulator_previous_stat.stat.islnk | default(false)

- name: Reject superseded main immediately before mutating release pointers
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ ocpp_simulator_source }}/scripts/verify_main_head.py"
      - "{{ ocpp_simulator_expected_main_sha }}"
  changed_when: false
  when:
    - ocpp_simulator_activate | bool
    - ocpp_simulator_expected_main_sha != ''

- name: Preserve previous release before changing current
  ansible.builtin.file:
    src: "{{ ocpp_simulator_old_target.stdout }}"
    dest: "{{ ocpp_simulator_previous }}"
    state: link
    force: true
  when:
    - ocpp_simulator_activate | bool
    - ocpp_simulator_current_stat.stat.islnk | default(false)
    - ocpp_simulator_old_target.stdout | default('') != ''

- name: Activate requested revision
  ansible.builtin.file:
    src: "{{ ocpp_simulator_release }}"
    dest: "{{ ocpp_simulator_current }}"
    state: link
    force: true
  when: ocpp_simulator_activate | bool

- name: Expose CLI in user bin directory
  ansible.builtin.file:
    src: "{{ ocpp_simulator_current }}/bin/ocpp-simulator"
    dest: "{{ ocpp_simulator_bin_dir }}/ocpp-simulator"
    state: link
    force: true

- name: Expose Go backend CLI in user bin directory
  ansible.builtin.file:
    src: "{{ ocpp_simulator_current }}/bin/ocpp-simulator-go"
    dest: "{{ ocpp_simulator_bin_dir }}/ocpp-simulator-go"
    state: link
    force: true

- name: Expose explicit Python backend CLI
  ansible.builtin.file:
    src: "{{ ocpp_simulator_current }}/bin/ocpp-simulator-py"
    dest: "{{ ocpp_simulator_bin_dir }}/ocpp-simulator-py"
    state: link
    force: true

- name: Verify active command
  ansible.builtin.command:
    argv: ["{{ ocpp_simulator_bin_dir }}/ocpp-simulator", --help]
  changed_when: false

- name: Verify explicit Python CLI
  ansible.builtin.command:
    argv: ["{{ ocpp_simulator_bin_dir }}/ocpp-simulator-py", --help]
  changed_when: false

- name: Verify Go backend dispatch
  ansible.builtin.command:
    argv: ["{{ ocpp_simulator_bin_dir }}/ocpp-simulator", --backend, go, --help]
  changed_when: false
